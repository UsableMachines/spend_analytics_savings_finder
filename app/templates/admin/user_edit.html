{% extends "layouts/base.html" %}
{% block title %}Edit User{% endblock %}
{% block page_title %}Edit User — {{ user.username }}{% endblock %}

{% block content %}
<div class="card" style="max-width:600px">
  <form method="POST">
    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
    <div class="form-group">
      <label>Username</label>
      <input type="text" class="form-control" value="{{ user.username }}" disabled>
    </div>
    <div class="form-group">
      <label for="email">Email</label>
      <input type="email" class="form-control" id="email" name="email" value="{{ user.email }}">
    </div>
    <div class="form-group">
      <label for="role_id">Role</label>
      <select class="form-control" id="role_id" name="role_id">
        {% for r in roles %}<option value="{{ r.id }}" {{ 'selected' if user.role_id == r.id }}>{{ r.name }}</option>{% endfor %}
      </select>
    </div>
    <div class="form-check">
      <input type="checkbox" id="is_active" name="is_active" {{ 'checked' if user.is_active }}>
      <label for="is_active">Account active</label>
    </div>
    <div class="form-group">
      <label for="password">New Password (leave blank to keep current)</label>
      <input type="password" class="form-control" id="password" name="password">
    </div>
    <div style="display:flex;gap:8px;margin-top:20px">
      <button type="submit" class="btn btn-primary">Update</button>
      <a href="{{ url_for('admin.admin_home') }}" class="btn">Cancel</a>
    </div>
  </form>
</div>
{% endblock %}
