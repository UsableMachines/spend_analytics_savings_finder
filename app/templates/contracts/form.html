{% extends "layouts/base.html" %}
{% block title %}{{ "Edit" if contract else "Add" }} Contract{% endblock %}
{% block page_title %}{{ "Edit" if contract else "Add" }} Contract{% endblock %}

{% block content %}
<div class="card" style="max-width:700px">
  <form method="POST">
    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
    <div class="form-group">
      <label for="title">Contract Title *</label>
      <input type="text" class="form-control" id="title" name="title" value="{{ contract.title if contract else '' }}" required>
    </div>
    <div class="form-row">
      <div class="form-group">
        <label for="supplier_id">Supplier *</label>
        <select class="form-control" id="supplier_id" name="supplier_id" required>
          <option value="">Select supplier</option>
          {% for s in suppliers %}<option value="{{ s.id }}" {{ 'selected' if contract and contract.supplier_id == s.id }}>{{ s.name }}</option>{% endfor %}
        </select>
      </div>
      <div class="form-group">
        <label for="status">Status</label>
        <select class="form-control" id="status" name="status">
          <option value="active" {{ 'selected' if not contract or contract.status == 'active' }}>Active</option>
          <option value="expired" {{ 'selected' if contract and contract.status == 'expired' }}>Expired</option>
          <option value="draft" {{ 'selected' if contract and contract.status == 'draft' }}>Draft</option>
        </select>
      </div>
    </div>
    <div class="form-row">
      <div class="form-group">
        <label for="start_date">Start Date</label>
        <input type="date" class="form-control" id="start_date" name="start_date" value="{{ contract.start_date.isoformat() if contract and contract.start_date else '' }}">
      </div>
      <div class="form-group">
        <label for="end_date">End Date</label>
        <input type="date" class="form-control" id="end_date" name="end_date" value="{{ contract.end_date.isoformat() if contract and contract.end_date else '' }}">
      </div>
    </div>
    <div class="form-group">
      <label for="total_value">Total Contract Value</label>
      <input type="number" step="0.01" class="form-control" id="total_value" name="total_value" value="{{ contract.total_value if contract else '' }}">
    </div>
    <div class="form-group">
      <label for="terms">Terms / Notes</label>
      <textarea class="form-control" id="terms" name="terms" rows="4">{{ contract.terms if contract else '' }}</textarea>
    </div>
    <div style="display:flex;gap:8px;margin-top:20px">
      <button type="submit" class="btn btn-primary">{{ "Update" if contract else "Add Contract" }}</button>
      <a href="{{ url_for('contracts.contract_list') }}" class="btn">Cancel</a>
    </div>
  </form>
</div>
{% endblock %}
