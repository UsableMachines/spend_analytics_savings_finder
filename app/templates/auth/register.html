{% extends "layouts/base.html" %}
{% block body_class %}page-register{% endblock %}
{% block title %}Register{% endblock %}
{% block content_public %}
<div class="auth-card">
  <h1>Create Account</h1>
  <form method="POST">
    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
    <div class="form-group">
      <label for="username">Username</label>
      <input type="text" class="form-control" id="username" name="username" required autofocus>
    </div>
    <div class="form-group">
      <label for="email">Email</label>
      <input type="email" class="form-control" id="email" name="email" required>
    </div>
    <div class="form-group">
      <label for="password">Password</label>
      <input type="password" class="form-control" id="password" name="password" required minlength="4">
    </div>
    <button type="submit" class="btn btn-primary" style="width:100%">Register</button>
    <div class="auth-footer">
      Already have an account? <a href="{{ url_for('auth.login') }}">Log in</a>
    </div>
  </form>
</div>
{% endblock %}
